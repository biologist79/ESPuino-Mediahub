services:
  mediahub:
    # The image is built by CI and published to GitHub's registry, so there is
    # nothing to compile here: `docker compose pull` fetches it, for amd64,
    # arm64 and arm/v7 alike. MEDIAHUB_TAG in your .env picks which one -
    # `latest` follows the main branch, and a `sha-abc1234` tag from the
    # package page pins (or rolls you back to) one exact commit.
    # To build from this checkout instead, see docker-compose.build.yml.
    image: ghcr.io/biologist79/espuino-mediahub:${MEDIAHUB_TAG:-latest}
    container_name: ${MEDIAHUB_NAME:-espuino-mediahub}
    ports:
      - "${MEDIAHUB_PORT:-8080}:8080"
    volumes:
      # Devices/cards/assignments (db.json) — small, structured data
      - "${MEDIAHUB_DATA:-./data}:/data"
      # Your own existing audio library, browsed and referenced in place —
      # MediaHub never writes here, just point this at wherever your music/
      # audiobook files already live. Read-only is enough (and enforced).
      - "${MEDIAHUB_MEDIA:-./media}:/media:ro"
    environment:
      - MEDIAHUB_DATA=/data
      - MEDIAHUB_MEDIA=/media
      # The service runs as www-data (33:33) by default, not as root: the
      # container starts as root only so entrypoint.sh can hand /data to this
      # uid/gid, and then steps down to it. So there is no chown to do by hand.
      #
      # Your ./media library is a different matter - it stays as it is and has
      # to be *readable* for this uid. Directory listing and file reading are
      # separate Unix permissions, so a track can show up in the browser yet
      # fail to save with "permission denied" if the file itself isn't
      # world-readable. Either `chmod -R o+rX /path/to/your/library`, or set
      # these two to the uid/gid that already owns it (`id -u` / `id -g`).
      - MEDIAHUB_UID=${MEDIAHUB_UID:-33}
      - MEDIAHUB_GID=${MEDIAHUB_GID:-33}
      - TZ=${TZ:-Europe/Berlin}
    restart: unless-stopped
